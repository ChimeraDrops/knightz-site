<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a1c"/>
      <stop offset="0.45" stop-color="#3a3f41"/>
      <stop offset="0.72" stop-color="#6c6b64"/>
      <stop offset="1" stop-color="#8a857a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#efe9da" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#d9d2c0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d9d2c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.45" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f6f2e8"/>
      <stop offset="1" stop-color="#d8d2c2"/>
    </radialGradient>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b968b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9b968b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9b968b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- the veiled sun -->
  <circle cx="1390" cy="330" r="360" fill="url(#halo)"/>
  <circle cx="1390" cy="330" r="88" fill="url(#sun)" filter="url(#blur3)" opacity="0.92"/>
  <circle cx="1406" cy="336" r="80" fill="#8d8a83" opacity="0.38" filter="url(#blur8)"/>
  <!-- haze bands -->
  <rect x="0" y="250" width="1920" height="70" fill="#a9a395" opacity="0.10" filter="url(#blur30)"/>
  <rect x="0" y="390" width="1920" height="90" fill="#a9a395" opacity="0.12" filter="url(#blur30)"/>

  <!-- far ridge: the Long Mynd and Stiperstones on the skyline -->
  <path d="M0 640 C140 610 260 600 380 612 C470 620 520 596 600 600 C700 606 760 585 840 590 C920 595 1000 618 1080 612 C1180 604 1260 580 1360 586 C1470 593 1560 620 1660 616 C1760 612 1840 600 1920 604 L1920 1080 L0 1080 Z" fill="#5a5a55" opacity="0.75"/>
  <!-- tors on the far ridge -->
  <path d="M640 600 l8 -14 l6 6 l7 -12 l9 20 Z M700 598 l6 -10 l5 4 l6 -9 l7 15 Z" fill="#4f4f4a" opacity="0.8"/>

  <g transform="matrix(-1 0 0 1 1920 0)">
  <!-- mid ridge: the Wrekin whale-back -->
  <path d="M0 720 C120 700 220 690 330 694 C430 698 520 660 640 610 C720 578 790 566 860 572 C940 580 1010 616 1090 650 C1170 684 1260 700 1380 706 C1520 712 1680 700 1920 690 L1920 1080 L0 1080 Z" fill="#3d3e3c"/>
  <!-- hillfort rings -->
  <path d="M700 590 C760 570 830 566 900 578" fill="none" stroke="#4a4b48" stroke-width="3"/>
  <path d="M680 604 C760 582 850 580 930 596" fill="none" stroke="#4a4b48" stroke-width="2"/>
  <!-- beacon -->
  <line x1="812" y1="572" x2="812" y2="548" stroke="#2c2d2b" stroke-width="3"/>
  <circle cx="812" cy="545" r="5" fill="#d2593f"/>
  <circle cx="812" cy="545" r="16" fill="#d2593f" opacity="0.18" filter="url(#blur8)"/>

  </g>

  <!-- river mist -->
  <rect x="0" y="735" width="1920" height="90" fill="url(#mist)" filter="url(#blur8)"/>

  <!-- near ground: Severn Vale with the manor -->
  <path d="M0 830 C180 812 360 806 520 812 C660 818 760 800 900 796 C1060 792 1180 806 1340 816 C1520 828 1700 820 1920 812 L1920 1080 L0 1080 Z" fill="#232524"/>

  <g transform="translate(1000 4)">
  <!-- the manor: palisade, hall, longhouses -->
  <g fill="#161817">
    <!-- hall -->
    <path d="M300 800 L300 760 L362 712 L424 760 L424 800 Z"/>
    <!-- longhouses -->
    <path d="M440 806 L440 782 L482 756 L540 782 L540 806 Z"/>
    <path d="M190 808 L190 786 L224 764 L276 786 L276 808 Z"/>
    <!-- chapel -->
    <path d="M556 806 L556 778 L578 762 L600 778 L600 806 Z"/>
    <rect x="575" y="748" width="6" height="16"/>
    <rect x="569" y="753" width="18" height="4"/>
  </g>
  <!-- palisade stakes -->
  <g fill="#121413">
    <path d="M150 812 l0 -26 l4 -6 l4 6 l0 26 Z"/>
    <path d="M150 812 h480 v8 h-480 Z"/>
  </g>
  <g fill="#121413">
    <path d="M168 812 v-22 l3.5-6 l3.5 6 v22z M180 812 v-24 l3.5-6 l3.5 6 v24z M192 812 v-21 l3.5-6 l3.5 6 v21z M204 812 v-23 l3.5-6 l3.5 6 v23z M216 812 v-22 l3.5-6 l3.5 6 v22z M228 812 v-24 l3.5-6 l3.5 6 v24z M240 812 v-21 l3.5-6 l3.5 6 v21z M252 812 v-23 l3.5-6 l3.5 6 v23z M264 812 v-22 l3.5-6 l3.5 6 v22z M276 812 v-24 l3.5-6 l3.5 6 v24z M288 812 v-22 l3.5-6 l3.5 6 v22z"/>
    <path d="M432 812 v-22 l3.5-6 l3.5 6 v22z M444 812 v-24 l3.5-6 l3.5 6 v24z M456 812 v-21 l3.5-6 l3.5 6 v21z M468 812 v-23 l3.5-6 l3.5 6 v23z M480 812 v-22 l3.5-6 l3.5 6 v22z M492 812 v-24 l3.5-6 l3.5 6 v24z M504 812 v-21 l3.5-6 l3.5 6 v21z M516 812 v-23 l3.5-6 l3.5 6 v23z M528 812 v-22 l3.5-6 l3.5 6 v22z M540 812 v-24 l3.5-6 l3.5 6 v24z M552 812 v-22 l3.5-6 l3.5 6 v22z M564 812 v-23 l3.5-6 l3.5 6 v23z M576 812 v-21 l3.5-6 l3.5 6 v21z M588 812 v-24 l3.5-6 l3.5 6 v24z M600 812 v-22 l3.5-6 l3.5 6 v22z M612 812 v-23 l3.5-6 l3.5 6 v23z"/>
  </g>
  <!-- hearth smoke -->
  <g fill="none" stroke="#8a867d" stroke-linecap="round" opacity="0.35" filter="url(#blur3)">
    <path d="M362 712 C356 680 378 660 368 630 C360 604 384 584 376 556" stroke-width="10"/>
    <path d="M490 756 C486 734 500 720 494 700" stroke-width="7"/>
  </g>

  </g>

  <!-- crows -->
  <g fill="none" stroke="#1d1f1e" stroke-width="2.4" stroke-linecap="round">
    <path d="M1010 420 q8 -7 15 0 q7 -7 15 0"/>
    <path d="M1080 452 q6 -5 11 0 q5 -5 11 0"/>
    <path d="M960 470 q5 -4 9 0 q4 -4 9 0"/>
  </g>

  <!-- foreground -->
  <path d="M0 930 C240 910 520 920 760 936 C1000 952 1300 940 1560 926 C1720 918 1840 920 1920 924 L1920 1080 L0 1080 Z" fill="#141615"/>
  <!-- grass tufts -->
  <g stroke="#1d201f" stroke-width="2" fill="none">
    <path d="M1500 930 l-6 -22 M1504 930 l2 -26 M1508 930 l8 -20 M1680 924 l-5 -18 M1684 924 l3 -22 M1688 924 l7 -17"/>
  </g>
</svg>
